slice_name: "Question c: Top 10 Customers by Total Transaction Value"
viz_type: table
description: >-
  CHALLENGE.md question c: top 10 customers by total transaction value (gross revenue, see
  question_c_top10_customers.yaml metric `total_transaction_value` for the documented gross-vs-net
  choice), filterable by product, card type, sales reason, sales date, status, city, state, and
  country (FR-7 -- the underlying dataset declares each as `filterable: true`; dashboard-wide
  native filters are wired onto this chart in P4-08). Reconciles to a direct fct_sales/dim_customer
  aggregate -- see scripts/test_top10_customers.py (P4-04 outer test).
params:
  datasource: 877c59cb-e27e-4a7c-a120-66bfb1520593__table
  viz_type: table
  groupby:
    - customer_name
  metric: total_transaction_value
  row_limit: 10
  order_desc: true
  adhoc_filters: []
  table_timestamp_format: smart_date
  show_cell_bars: true
  color_pn: true
  column_config:
    total_transaction_value:
      d3NumberFormat: "$,.2f"
  conditional_formatting:
    - operator: None
      column: total_transaction_value
      colorScheme: "#2A78D6"
