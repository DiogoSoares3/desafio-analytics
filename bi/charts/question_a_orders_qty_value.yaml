slice_name: "Question a: Orders / Quantity / Value by Product"
viz_type: table
description: >-
  CHALLENGE.md question a -- number of orders, quantity purchased, and total transaction value,
  sliced by product (default groupby) and filterable by card type, sales date, customer, status,
  city, state, country, and sales channel (all declared filterable=true on
  question_a_sales_detail.yaml). Re-sliceable by any of those columns in place of product. See
  scripts/validate_question_a.py (P4-02 outer test) for the reconciliation proof.
params:
  datasource: 018c4e65-289c-4f34-9861-6606f5f8051a__table
  viz_type: table
  groupby:
    - product_name
  metrics:
    - number_of_orders
    - units_purchased
    - total_transaction_value
  adhoc_filters: []
  row_limit: 1000
  order_desc: true
  table_timestamp_format: smart_date
  show_cell_bars: true
  color_pn: true
  conditional_formatting:
    - operator: None
      column: number_of_orders
      colorScheme: "#1baf7a"
    - operator: None
      column: units_purchased
      colorScheme: "#1baf7a"
    - operator: None
      column: total_transaction_value
      colorScheme: "#1baf7a"
query_context: null
cache_timeout: null
