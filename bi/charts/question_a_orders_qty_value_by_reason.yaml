slice_name: "Question a: Orders / Quantity / Value by Sales Reason"
viz_type: table
description: >-
  CHALLENGE.md question a's "sales reason" slice -- number of orders, quantity purchased, and
  total transaction value grouped by sales reason (question_a_sales_by_reason.yaml, bridge join
  per ADR-0003). Complements question_a_orders_qty_value.yaml, whose dataset has no reason join
  to avoid fanning out the other eight dims. See scripts/validate_question_a.py (P4-02 outer
  test) for the bridge-join reconciliation proof.
params:
  datasource: 21627596-9b32-4772-bf11-346639fd69be__table
  viz_type: table
  groupby:
    - sales_reason_name
  metrics:
    - number_of_orders
    - units_purchased
    - total_transaction_value
  adhoc_filters: []
  row_limit: 1000
  order_desc: true
  table_timestamp_format: smart_date
  show_cell_bars: true
  color_pn: true
  conditional_formatting:
    - operator: None
      column: number_of_orders
      colorScheme: "#eda100"
    - operator: None
      column: units_purchased
      colorScheme: "#eda100"
    - operator: None
      column: total_transaction_value
      colorScheme: "#eda100"
query_context: null
cache_timeout: null
