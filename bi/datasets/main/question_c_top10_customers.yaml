table_name: question_c_top10_customers
schema: main
description: >-
  CHALLENGE.md question c: top-10 customers by total transaction value, filterable by product,
  card type, sales reason, sales date, status, city, state, and country (FR-6/FR-7). Virtual
  dataset -- a read-only SQL join over the already-tested fct_sales/dim_* marts, same tested
  numbers, no parallel metric layer (NFR-3). Sales reason is a scalar per-order subquery over
  bridge_order_sales_reason (ADR-0003), not a row join, so it does not fan out fct_sales'
  line-grain rows.
main_dttm_col: order_date
default_endpoint: null
offset: 0
cache_timeout: null
sql: >-
  select
      f.sales_fact_key,
      f.sales_order_number,
      f.is_online,
      f.order_qty,
      f.gross_revenue,
      f.discount_amount,
      f.net_revenue,
      c.customer_key,
      c.full_name as customer_name,
      p.product_name,
      cc.card_type,
      os.status_label,
      g.city,
      g.state_province,
      g.country,
      d.date_day as order_date,
      (
          select string_agg(distinct r.sales_reason_name, ', ')
          from bridge_order_sales_reason b
          inner join dim_sales_reason r on b.sales_reason_key = r.sales_reason_key
          where b.sales_order_number = f.sales_order_number
      ) as sales_reason_names
  from fct_sales f
  inner join dim_customer c on f.customer_key = c.customer_key
  inner join dim_product p on f.product_key = p.product_key
  inner join dim_credit_card cc on f.credit_card_key = cc.credit_card_key
  inner join dim_order_status os on f.order_status_key = os.order_status_key
  inner join dim_geography g on f.geography_key = g.geography_key
  inner join dim_date d on f.date_key = d.date_key
params: null
template_params: null
filter_select_enabled: true
fetch_values_predicate: null
extra: null
