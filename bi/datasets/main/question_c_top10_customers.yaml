    description: dim_geography.city (ship-to, ADR-0005) -- required filter (FR-7).
  - column_name: state_province
    verbose_name: State/Province
    is_dttm: false
    is_active: true
    type: VARCHAR
    groupby: true
    filterable: true
    description: dim_geography.state_province (ship-to, ADR-0005) -- required filter (FR-7).
  - column_name: country
    verbose_name: Country
    is_dttm: false
