metrics:
  # Total transaction value (question c) -- gross revenue, not net (documented choice, see
  # scripts/test_top10_customers.py module docstring): consistent with the P4-01 hero KPI
  # "Total Sales Revenue" (sum(gross_revenue)) and the régua's own headline reconciliation figure
  # (2011 all-channel gross = $12,646,112.16, ADR-0001). No parallel net-revenue ranking metric is
  # introduced for this slice.
  - metric_name: total_transaction_value
    verbose_name: Total Transaction Value
    metric_type: null
    expression: SUM(gross_revenue)
    description: >-
      Total transaction value = gross revenue (ADR-0001), sum(gross_revenue) over fct_sales
      joined to dim_customer. Documented choice: gross, not net -- consistent with the P4-01 hero
      KPI and the régua's headline reconciliation figure. Ranks customers for question c (FR-6).
    d3format: "$,.2f"
    warning_text: null
