      Distinct order count for question a. Definition: count(distinct sales_order_number) over
      fct_sales, same formula as the P4-01 hero KPI.
    d3format: ",d"
    warning_text: null
  - metric_name: units_purchased
    verbose_name: Units Purchased
    metric_type: null
    expression: SUM(order_qty)
    description: >-
      Total units ordered for question a. Definition: sum(order_qty) over fct_sales, same
      formula as the P4-01 hero KPI.
    d3format: ",d"
    warning_text: null
  - metric_name: total_transaction_value
    verbose_name: Total Transaction Value
    metric_type: null
    expression: SUM(gross_revenue)
    description: >-
      Total gross transaction value for question a. Definition: sum(gross_revenue) over
      fct_sales (ADR-0001), same formula as the P4-01 hero KPI "Total Sales Revenue".
    d3format: "$,.2f"
    warning_text: null
