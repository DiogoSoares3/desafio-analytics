table_name: question_a_sales_detail
schema: main
description: >-
  Virtual dataset (P4-02) answering CHALLENGE.md question a -- orders/quantity/value sliced by
  product, card type, sales date, customer, status, city, state, country, and sales channel.
  One row per fct_sales order line joined to its six single-valued dims (product, credit card,
  order status, geography [ship-to, ADR-0005], date, customer) -- no bridge join here, so no
  fan-out (sales reason is a separate dataset, question_a_sales_by_reason.yaml, ADR-0003). Same
  tested fct_sales grain -- no parallel metric layer (NFR-3).
main_dttm_col: date_day
default_endpoint: null
offset: 0
cache_timeout: null
sql: >-
  select
      f.sales_fact_key,
      f.sales_order_number,
      f.is_online,
      f.order_qty,
      f.gross_revenue,
      f.discount_amount,
      f.net_revenue,
      p.product_name,
      p.category_name,
      p.subcategory_name,
      cc.card_type,
      os.status_label,
      g.city,
      g.state_province,
      g.country,
      d.date_day,
      d.year,
      d.month_name,
      d.year_month,
      c.full_name as customer_name,
      c.customer_type
  from fct_sales f
  left join dim_product p on f.product_key = p.product_key
  left join dim_credit_card cc on f.credit_card_key = cc.credit_card_key
  left join dim_order_status os on f.order_status_key = os.order_status_key
  left join dim_geography g on f.geography_key = g.geography_key
  left join dim_date d on f.date_key = d.date_key
  left join dim_customer c on f.customer_key = c.customer_key
params: null
template_params: null
filter_select_enabled: true
fetch_values_predicate: null
extra: null
