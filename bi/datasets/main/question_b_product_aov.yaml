table_name: question_b_product_aov
schema: main
description: >-
  Virtual dataset (BI-as-code, ADR-0002) answering CHALLENGE.md question b: "which products have
  the highest average order value by month, year, city, state, and country?" One row per
  fct_sales line joined to dim_product, dim_date, and dim_geography (ship-to, ADR-0005) -- the
  same tested marts, no parallel metric layer (NFR-3). See ARCHITECTURE.md SS fct_sales for the
  AOV formula and scripts/validate_question_b.py (P4-03 outer test).
main_dttm_col: null
default_endpoint: null
offset: 0
cache_timeout: null
sql: >-
  select
      dim_product.product_name as product_name,
      dim_date.year as year,
      dim_date.month_number as month_number,
      dim_date.month_name as month_name,
      dim_date.year_month as year_month,
      dim_geography.city as city,
      dim_geography.state_province as state_province,
      dim_geography.country as country,
      fct_sales.sales_order_number as sales_order_number,
      fct_sales.gross_revenue as gross_revenue,
      fct_sales.discount_amount as discount_amount
  from fct_sales
  inner join dim_product on fct_sales.product_key = dim_product.product_key
  inner join dim_date on fct_sales.date_key = dim_date.date_key
  inner join dim_geography on fct_sales.geography_key = dim_geography.geography_key
params: null
template_params: null
filter_select_enabled: true
fetch_values_predicate: null
extra: null
