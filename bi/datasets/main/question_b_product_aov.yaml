metrics:
  # Question b (FR-6/CHALLENGE.md): AOV -- identical formula to fct_sales.yaml's
  # `average_order_value` hero KPI (ARCHITECTURE.md SS fct_sales, "AOV = (gross - discount) /
  # distinct orders"), applied here per product/month/year/geography group. No parallel metric
  # layer (NFR-3).
  - metric_name: average_order_value
    verbose_name: Average Order Value
    metric_type: null
    expression: (SUM(gross_revenue) - SUM(discount_amount)) / COUNT(DISTINCT sales_order_number)
    description: >-
      AOV = (gross - discount) / distinct orders (ARCHITECTURE.md SS fct_sales), computed per
      product/month/year/city/state/country group for question b.
    d3format: "$,.2f"
    warning_text: null
