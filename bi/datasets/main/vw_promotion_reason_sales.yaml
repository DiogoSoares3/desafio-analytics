table_name: vw_promotion_reason_sales
schema: main
description: >-
  Virtual dataset (SQL) joining fct_sales -> sales_order_number -> bridge_order_sales_reason ->
  dim_sales_reason, plus dim_product for the human-readable product name (Gold, already-tested
  marts -- no parallel metric layer, NFR-3). The base fact carries no reason FK, so this join
  does not fan out gross for a single-reason filter (ADR-0003), per the no-fan-out invariant
  P3-04's singular test proves. Backs question f (top product by units for the "On Promotion"
  sales reason) and the Promotion-impact hero KPI (FR-8). See ARCHITECTURE.md SS
  bridge_order_sales_reason and scripts/validate_question_f.py (P4-07 outer test).
sql: |-
  select
      fct_sales.sales_order_number,
      dim_product.product_name,
      fct_sales.order_qty,
      fct_sales.gross_revenue,
      fct_sales.discount_amount,
      dim_sales_reason.sales_reason_name,
      dim_sales_reason.sales_reason_type
  from fct_sales
  inner join bridge_order_sales_reason
      on fct_sales.sales_order_number = bridge_order_sales_reason.sales_order_number
  inner join dim_sales_reason
      on bridge_order_sales_reason.sales_reason_key = dim_sales_reason.sales_reason_key
  inner join dim_product
      on fct_sales.product_key = dim_product.product_key
main_dttm_col: null
default_endpoint: null
offset: 0
cache_timeout: null
params: null
template_params: null
filter_select_enabled: true
fetch_values_predicate: null
extra: null
