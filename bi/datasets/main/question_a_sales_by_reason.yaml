table_name: question_a_sales_by_reason
schema: main
description: >-
  Virtual dataset (P4-02) answering CHALLENGE.md question a's "sales reason" slice --
  orders/quantity/value joined through bridge_order_sales_reason to dim_sales_reason
  (ADR-0003, no fact FK, so a single-reason filter/groupby never fans out gross revenue -- the
  same invariant P3-04's fct_sales_gross_invariant_under_bridge singular test proves
  structurally). Separate from question_a_sales_detail.yaml, whose six single-valued dim joins
  would otherwise be multiplied by every order's reason count. Same tested fct_sales grain -- no
  parallel metric layer (NFR-3).
main_dttm_col: null
default_endpoint: null
offset: 0
cache_timeout: null
sql: >-
  select
      f.sales_fact_key,
      f.sales_order_number,
      f.is_online,
      f.order_qty,
      f.gross_revenue,
      f.discount_amount,
      f.net_revenue,
      r.sales_reason_name,
      r.sales_reason_type
  from fct_sales f
  join bridge_order_sales_reason b on f.sales_order_number = b.sales_order_number
  join dim_sales_reason r on b.sales_reason_key = r.sales_reason_key
params: null
template_params: null
filter_select_enabled: true
fetch_values_predicate: null
extra: null
uuid: 21627596-9b32-4772-bf11-346639fd69be
version: 1.0.0
