columns:
  - column_name: sales_fact_key
    verbose_name: Sales Fact Key
    is_dttm: false
    is_active: true
    type: VARCHAR
    groupby: false
    filterable: false
    description: Hashed surrogate PK of the underlying fct_sales line (dbt_utils.generate_surrogate_key over salesorderdetailid).
  - column_name: sales_order_number
    verbose_name: Sales Order Number
    is_dttm: false
    is_active: true
    type: VARCHAR
    groupby: true
    filterable: true
    description: Degenerate dimension -- business order number.
  - column_name: is_online
    verbose_name: Sales Channel (Online)
    is_dttm: false
    is_active: true
    type: BOOLEAN
    groupby: true
    filterable: true
    description: Channel attribute (ADR-0010) -- true for online orders, false for reseller orders.
  - column_name: order_qty
    verbose_name: Order Quantity
    is_dttm: false
    is_active: true
    type: BIGINT
    groupby: false
    filterable: true
    description: Units ordered on the line.
  - column_name: gross_revenue
    verbose_name: Gross Revenue
    is_dttm: false
    is_active: true
    type: DOUBLE
    groupby: false
    filterable: true
    description: Pre-discount/pre-tax/pre-freight line revenue -- UnitPrice x OrderQty (ADR-0001).
  - column_name: discount_amount
    verbose_name: Discount Amount
    is_dttm: false
    is_active: true
    type: DOUBLE
    groupby: false
    filterable: true
    description: Line discount -- UnitPriceDiscount x UnitPrice x OrderQty.
  - column_name: net_revenue
    verbose_name: Net Revenue
    is_dttm: false
    is_active: true
    type: DOUBLE
    groupby: false
    filterable: true
    description: gross_revenue - discount_amount (reconciles to source LineTotal, ADR-0001).
  - column_name: sales_reason_name
    verbose_name: Sales Reason
    is_dttm: false
    is_active: true
    type: VARCHAR
    groupby: true
    filterable: true
    description: Reason name (dim_sales_reason), required "sales reason" slice for question a.
  - column_name: sales_reason_type
    verbose_name: Sales Reason Type
    is_dttm: false
    is_active: true
    type: VARCHAR
    groupby: true
    filterable: true
    description: Reason category (dim_sales_reason).
metrics:
  - metric_name: number_of_orders
    verbose_name: Number of Orders
    metric_type: null
    expression: COUNT(DISTINCT sales_order_number)
    description: >-
      Distinct order count for question a, sliced by sales reason. Definition:
      count(distinct sales_order_number) over the bridge join, same formula as
      question_a_sales_detail.yaml and the P4-01 hero KPI.
    d3format: ",d"
    warning_text: null
  - metric_name: units_purchased
    verbose_name: Units Purchased
    metric_type: null
    expression: SUM(order_qty)
    description: >-
      Total units ordered for question a, sliced by sales reason. Definition: sum(order_qty)
      over the bridge join.
    d3format: ",d"
    warning_text: null
  - metric_name: total_transaction_value
    verbose_name: Total Transaction Value
    metric_type: null
    expression: SUM(gross_revenue)
    description: >-
      Total gross transaction value for question a, sliced by sales reason. Definition:
      sum(gross_revenue) over the bridge join (ADR-0001). Exact for a single-reason filter
      (ADR-0003, no fan-out) -- see P3-04's fct_sales_gross_invariant_under_bridge.
    d3format: "$,.2f"
    warning_text: null
