metrics:
  # Question d (CHALLENGE.md): total transaction value ranking cities -- same formula as the P4-01
  # hero KPI "Total Sales Revenue" (sum(gross_revenue)), so there is only one definition of
  # "transaction value" across the dashboard (NFR-3, ADR-0001).
  - metric_name: total_transaction_value
    verbose_name: Total Transaction Value
    metric_type: null
    expression: SUM(gross_revenue)
    description: >-
      Total transaction value = sum(gross_revenue) (ADR-0001), same definition as the P4-01 hero
      KPI "Total Sales Revenue" -- no parallel metric layer (NFR-3).
    d3format: "$,.2f"
    warning_text: null
