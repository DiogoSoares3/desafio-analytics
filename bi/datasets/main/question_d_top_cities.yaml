table_name: question_d_top_cities
schema: main
description: >-
  Question d (CHALLENGE.md): fct_sales order lines joined to every dimension the required filter
  set (product, card type, sales reason, sales date, customer, status, city, state, country) needs
  -- one row per sales-order line, no fan-out (ADR-0004). Sales reason is resolved via a correlated
  subquery over bridge_order_sales_reason/dim_sales_reason (ADR-0003) rather than a join, so
  aggregates over this dataset never fan out even before a reason filter is applied. Geography is
  ship-to (ADR-0005). No parallel metric layer (NFR-3) -- every column/metric here is read straight
  from the tested marts.
main_dttm_col: order_date
default_endpoint: null
offset: 0
cache_timeout: null
sql: >-
  select
      fct_sales.sales_fact_key,
      fct_sales.sales_order_number,
      fct_sales.is_online,
      fct_sales.order_qty,
      fct_sales.gross_revenue,
      fct_sales.discount_amount,
      fct_sales.net_revenue,
      dim_product.product_name,
      dim_product.category_name,
      dim_product.subcategory_name,
      dim_credit_card.card_type,
      dim_order_status.status_label,
      dim_date.date_day as order_date,
      dim_date.year,
      dim_date.month_name,
      dim_date.year_month,
      dim_customer.full_name as customer_name,
      dim_customer.customer_type,
      dim_geography.city,
      dim_geography.state_province,
      dim_geography.country,
      (
          select string_agg(distinct dim_sales_reason.sales_reason_name, ', ')
          from bridge_order_sales_reason
          inner join dim_sales_reason
              on bridge_order_sales_reason.sales_reason_key = dim_sales_reason.sales_reason_key
          where bridge_order_sales_reason.sales_order_number = fct_sales.sales_order_number
      ) as sales_reason_names
  from fct_sales
  left join dim_product
      on fct_sales.product_key = dim_product.product_key
  left join dim_credit_card
      on fct_sales.credit_card_key = dim_credit_card.credit_card_key
  left join dim_order_status
      on fct_sales.order_status_key = dim_order_status.order_status_key
  left join dim_date
      on fct_sales.date_key = dim_date.date_key
  left join dim_customer
      on fct_sales.customer_key = dim_customer.customer_key
  left join dim_geography
      on fct_sales.geography_key = dim_geography.geography_key
params: null
template_params: null
