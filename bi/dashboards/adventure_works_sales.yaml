dashboard_title: "Adventure Works — Sales"
description: >-
  Deliverable-equivalence dashboard (P4-08, ADR-0002, FR-9): assembles every chart built in
  P4-01-P4-07 -- the five hero-KPI tiles (Total Sales Revenue, Number of Orders, Units Sold,
  Average Order Value, Promotion-Impact Revenue) and the seven charts answering CHALLENGE.md
  questions a-f -- onto one committed Superset dashboard. All charts read the same tested
  fct_sales / dim_* / bridge_order_sales_reason marts (Phase 2-3), no parallel metric layer
  (NFR-3). See bi/README.md for run instructions and the metric-definitions tables (the analogue
  of documented DAX) and scripts/test_dashboard_bundle.py for the outer BDD reconciliation
  proof (P4-08).
css: null
slug: adventure-works-sales
uuid: 4c9c4c9a-2f7e-4a1e-8f5a-6d0e3f2c1b7a
version: 1.0.0
metadata:
  color_scheme: supersetColors
  refresh_frequency: 0
  # FR-7: the dashboard-wide filter set -- sales channel (is_online, online/reseller) plus every
  # other required filter (product, card type, sales reason, order date, customer, order status,
  # city, state, country). Targets question_a_sales_detail (P4-02), the dataset carrying the full
  # required-filter column set (question_a_sales_by_reason for the reason-only column, since a
  # reason join is kept off the detail dataset to avoid fan-out, ADR-0003). Every native filter
  # applies to all charts on this dashboard by default (Superset's cross-filter scoping), so
  # narrowing e.g. sales channel = online reshapes every hero KPI and every question chart at
  # once -- proven structurally (each targeted column is declared filterable: true on its
  # dataset) by scripts/test_dashboard_bundle.py.
  native_filter_configuration:
    - id: NATIVE_FILTER-sales_channel
      name: "Sales Channel"
      filterType: filter_select
      targets:
        - datasetUuid: 018c4e65-289c-4f34-9861-6606f5f8051a
          column:
            name: is_online
      scope:
        rootPath: [ROOT_ID]
        excluded: []
    - id: NATIVE_FILTER-product
      name: "Product"
      filterType: filter_select
      targets:
        - datasetUuid: 018c4e65-289c-4f34-9861-6606f5f8051a
          column:
            name: product_name
      scope:
        rootPath: [ROOT_ID]
        excluded: []
    - id: NATIVE_FILTER-card_type
      name: "Card Type"
      filterType: filter_select
      targets:
