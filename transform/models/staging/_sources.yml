version: 2

sources:
  - name: adventure_works
    description: >
      Raw AdventureWorks online-sales tables (Bronze). Offline, these are stood in by dbt seeds
      loaded into the `adventure_works` schema; in production the same source points at the real
      curated `adventure_works` schema. Only online sales are in scope (see PRD / ADR-0002).
    schema: adventure_works
    tables:
      - name: salesorderheader
        description: One row per sales order (header). `onlineorderflag` splits online vs reseller.
        columns:
          - name: salesorderid
            description: Order natural key.
            data_tests: [unique, not_null]
          - name: customerid
            description: FK to customer.
            data_tests: [not_null]
          - name: onlineorderflag
            description: True for online (in-scope) orders.
            data_tests: [not_null]
          - name: status
            description: Order status code (1-6); resolved by dim_order_status.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: ref('dim_order_status')
                    field: status_code
        data_tests:
          - dbt_expectations.expect_table_row_count_to_be_between:
              arguments:
                min_value: 1

      - name: salesorderdetail
        description: One row per order line — the grain of fct_sales (ADR-0004).
        columns:
          - name: salesorderdetailid
            description: Order-line natural key.
            data_tests: [unique, not_null]
          - name: salesorderid
            description: FK to sales order header.
            data_tests: [not_null]
          - name: productid
            description: FK to product.
            data_tests: [not_null]
          - name: orderqty
            description: Units on the line.
            data_tests: [not_null]

      - name: salesorderheadersalesreason
        description: Bridge — order to sales reason, many-to-many (ADR-0003).
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [salesorderid, salesreasonid]
        columns:
          - name: salesorderid
            description: FK to sales order header.
            data_tests: [not_null]
          - name: salesreasonid
            description: FK to sales reason.
            data_tests: [not_null]

      - name: salesreason
        description: Sales reason lookup (e.g. Promotion).
        columns:
          - name: salesreasonid
            description: Reason natural key.
            data_tests: [unique, not_null]
          - name: name
            description: Reason name.
            data_tests: [not_null]
          - name: reasontype
            description: Reason category (e.g. Marketing, Other).
            data_tests: [not_null]

      - name: customer
        description: Customers; online customers link to a person (storeid null).
        columns:
          - name: customerid
            description: Customer natural key.
            data_tests: [unique, not_null]

      - name: person
        description: Individual persons (names) behind online customers.
        columns:
          - name: businessentityid
            description: Person natural key.
            data_tests: [unique, not_null]

      - name: product
        description: Products sold.
        columns:
          - name: productid
            description: Product natural key.
            data_tests: [unique, not_null]

      - name: productsubcategory
        description: Product subcategory lookup.
        columns:
          - name: productsubcategoryid
            description: Subcategory natural key.
            data_tests: [unique, not_null]

      - name: productcategory
        description: Product category lookup.
        columns:
          - name: productcategoryid
            description: Category natural key.
            data_tests: [unique, not_null]

      - name: address
        description: Addresses (city + state/province) for ship-to / bill-to.
        columns:
          - name: addressid
            description: Address natural key.
            data_tests: [unique, not_null]

      - name: stateprovince
        description: State/province lookup, links to country region.
        columns:
          - name: stateprovinceid
            description: State/province natural key.
            data_tests: [unique, not_null]

      - name: countryregion
        description: Country/region lookup.
        columns:
          - name: countryregioncode
            description: Country/region natural key.
            data_tests: [unique, not_null]

      - name: creditcard
        description: Credit cards; `cardtype` feeds dim_credit_card.
        columns:
          - name: creditcardid
            description: Credit card natural key.
            data_tests: [unique, not_null]
          - name: cardtype
            description: Card type (e.g. Vista, SuperiorCard).
            data_tests: [not_null]

      - name: specialoffer
        description: Special offers / discounts applied to order lines.
        columns:
          - name: specialofferid
            description: Special offer natural key.
            data_tests: [unique, not_null]
