version: 2

models:
  - name: dim_geography
    description: >
      Conformed geography dimension (Gold) at the grain of city + state/province + country,
      deduped across all AdventureWorks addresses. Reused by dim_customer and by fct_sales'
      ship-to geography FK (ADR-0005). SCD Type 1 (ADR-0008).
    columns:
      - name: geography_key
        description: Hashed surrogate primary key (dbt_utils.generate_surrogate_key over city, state_province, country; ADR-0007).
        data_tests:
          - unique
          - not_null
      - name: city
        description: City name.
        data_tests:
          - not_null
      - name: state_province
        description: State or province name.
        data_tests:
          - not_null
      - name: country
        description: Country/region name.
        data_tests:
          - not_null

  - name: dim_product
    description: >
      Conformed product dimension (Gold), one row per product, joined to its subcategory and
      category names. SCD Type 1 (ADR-0008).
    columns:
      - name: product_key
        description: Hashed surrogate primary key (dbt_utils.generate_surrogate_key over product_id; ADR-0007).
        data_tests:
          - unique
          - not_null
      - name: product_id
        description: Natural key from the source product table.
        data_tests:
          - not_null
      - name: product_name
        description: Product name.
        data_tests:
          - not_null
      - name: product_number
        description: Product number (SKU-like business code).
        data_tests:
          - not_null
      - name: subcategory_name
        description: Product subcategory name (nullable — some products have no subcategory).
      - name: category_name
        description: Product category name (nullable — some products have no subcategory/category).

  - name: dim_customer
    description: >
      Conformed customer dimension (Gold) — **individuals only** (online customers: `person`-backed,
      `storeid` is null; resellers excluded, online-only scope). SCD Type 1 (ADR-0008).
    columns:
      - name: customer_key
        description: Hashed surrogate primary key (dbt_utils.generate_surrogate_key over customer_id; ADR-0007).
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Natural key from the source customer table.
        data_tests:
          - not_null
      - name: full_name
        description: Customer's full name (person first_name + last_name).
        data_tests:
          - not_null

  - name: dim_date
    description: >
      Gap-free daily calendar (Gold) generated via dbt_utils.date_spine, bounds computed
      dynamically from min/max(order_date) in staged salesorderheader (ADR-0006).
    columns:
      - name: date_key
        description: Hashed surrogate primary key (dbt_utils.generate_surrogate_key over date_day; ADR-0007).
        data_tests:
          - unique
          - not_null
      - name: date_day
        description: Calendar date (day grain).
        data_tests:
          - unique
          - not_null
      - name: year
        description: Calendar year.
        data_tests:
          - not_null
      - name: month_number
        description: Month number (1-12).
        data_tests:
          - not_null
      - name: month_name
        description: Full month name (e.g. January).
        data_tests:
          - not_null
      - name: year_month
        description: Year-month string (YYYY-MM).
        data_tests:
          - not_null
      - name: day_of_week
        description: Full weekday name (e.g. Monday).
        data_tests:
          - not_null
      - name: is_weekend
        description: True if the date falls on Saturday or Sunday.
        data_tests:
          - not_null

  - name: dim_credit_card
    description: >
      Conformed credit card dimension (Gold), one row per credit card, with its card type.
      SCD Type 1 (ADR-0008).
    columns:
      - name: credit_card_key
        description: Hashed surrogate primary key (dbt_utils.generate_surrogate_key over credit_card_id; ADR-0007).
        data_tests:
          - unique
          - not_null
      - name: credit_card_id
        description: Natural key from the source credit card table.
        data_tests:
          - not_null
      - name: card_type
        description: Card type (e.g. Vista, SuperiorCard).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Vista", "SuperiorCard", "Distinguish", "ColonialVoice"]

  - name: dim_sales_reason
    description: >
      Conformed sales reason dimension (Gold), one row per sales reason with its name and
      category. Reached from fct_sales via bridge_order_sales_reason, not a direct fact FK
      (ADR-0003). SCD Type 1 (ADR-0008).
    columns:
      - name: sales_reason_key
        description: Hashed surrogate primary key (dbt_utils.generate_surrogate_key over sales_reason_id; ADR-0007).
        data_tests:
          - unique
          - not_null
      - name: sales_reason_id
        description: Natural key from the source sales reason table.
        data_tests:
          - not_null
      - name: sales_reason_name
        description: Reason name (e.g. Promotion, Price, Quality).
        data_tests:
          - not_null
      - name: sales_reason_type
        description: Reason category (e.g. Marketing, Other).
        data_tests:
          - not_null

  - name: bridge_order_sales_reason
    description: >
      Multi-valued bridge (Gold), grain order × sales reason (ADR-0003). Resolves orders to
      every sales reason they carry without fanning `fct_sales` out — the base fact carries no
      reason FK, so gross revenue never double-counts. Reached from `fct_sales` via
      `sales_order_number`.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sales_order_number, sales_reason_key]
    columns:
      - name: sales_order_number
        description: Degenerate order identifier (business order number), FK-joinable from fct_sales.
        data_tests:
          - not_null
      - name: sales_reason_key
        description: Hashed surrogate FK to dim_sales_reason (dbt_utils.generate_surrogate_key over sales_reason_id; ADR-0007).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sales_reason')
                field: sales_reason_key

  - name: dim_order_status
    description: >
      Conformed order status dimension (Gold), one row per AdventureWorks order status code
      (1-6) with its human-readable label. Built from the `order_status` seed. SCD Type 1
      (ADR-0008).
    columns:
      - name: order_status_key
        description: Hashed surrogate primary key (dbt_utils.generate_surrogate_key over status_code; ADR-0007).
        data_tests:
          - unique
          - not_null
      - name: status_code
        description: AdventureWorks order status code (1-6).
        data_tests:
          - unique
          - not_null
      - name: status_label
        description: Human-readable order status label (e.g. Shipped, Cancelled).
        data_tests:
          - not_null
